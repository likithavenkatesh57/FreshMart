# PROPOSED business-context file. VendriftAI does not read this today (OUTSTANDING).
# It stays in the customer's own repo, so no business data leaves the customer.
customer:
  name: "FreshMart"
  sector: "Supermarket / Retail chain"
  scale: "Large: 400 stores, about 9% of revenue online"
  business_model: "400-store supermarket chain; in-store POS from a separate vendor; online grocery delivery is the growth channel"
services:
  - name: "Online grocery checkout"
    paths: ["src/online-grocery/checkoutCharge.js"]
    environment: production
    business_criticality: critical
    owner: "E-commerce Payments"
  - name: "Delivery ETA SMS"
    paths: ["src/delivery/deliveryEtaSms.js"]
    environment: production
    business_criticality: high
    owner: "Delivery Tech"
  - name: "Store-to-HQ inventory sync"
    paths: ["src/stores/inventorySync.js"]
    environment: production
    business_criticality: critical
    owner: "Store Systems / Supply Chain IT"
  - name: "Daily shelf price file to stores"
    paths: ["src/stores/priceFileUpload.js"]
    environment: production
    business_criticality: critical
    owner: "Store Systems / Supply Chain IT"
  - name: "Weekly promo flyer email (about 4M subscribers)"
    paths: ["src/marketing/weeklyFlyer.js"]
    environment: production
    business_criticality: medium
    owner: "CRM / Marketing Tech"
change_freezes:
  - from: 2026-11-25
    to: 2027-01-05
    reason: "Holiday peak code freeze"
integrations:
  erp:
    enabled: false   # opt-in only; off by default (OUTSTANDING feature)
    system: "SAP S/4HANA Retail"
