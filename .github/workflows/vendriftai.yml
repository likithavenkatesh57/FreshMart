name: VendriftAI
# Manual runs and /vendriftai comments only. No schedule on purpose.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  vendriftai:
    if: >-
      github.event_name != 'issue_comment' ||
      startsWith(github.event.comment.body, '/vendriftai')
    runs-on: ubuntu-latest
    concurrency:
      group: vendriftai
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: svudgimath/vendriftai-action@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          token: ${{ secrets.VENDRIFTAI_PAT }}
